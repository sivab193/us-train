[package]
name = "train-api"
version = "1.0.0"
edition = "2021"
description = "Amtrak GTFS schedule-search API (Phase 1) for train.us.siv19.dev"

[[bin]]
name = "train-api"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sqlx used in runtime-query mode (query_as / query) so the build does NOT
# require a live database. No compile-time query verification.
sqlx = { version = "0.7", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"

[profile.release]
opt-level = 3
lto = "thin"
