[project]
name = "train-cli"
version = "1.0.0"
description = "Terminal client for the train.us.siv19.dev Amtrak schedule API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12,<1.0",
    "httpx>=0.27,<1.0",
    "rich>=13.0",
]

[project.scripts]
train = "train_cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["train_cli"]
