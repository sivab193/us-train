name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements*.txt
            ingestion/requirements.txt
            mcp/requirements.txt
            cli/pyproject.toml
      - name: Install API test dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Test API
        working-directory: api
        run: python -m pytest -q
      - name: Test ingestion transforms
        working-directory: ingestion
        run: python -m pytest -q
      - name: Validate all Python sources
        run: python -m compileall -q api ingestion mcp cli

  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, ingestion, mcp]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }} image
        run: docker build --tag train-${{ matrix.service }}:ci ./${{ matrix.service }}
